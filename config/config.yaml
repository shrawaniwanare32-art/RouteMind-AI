project:
  name: RouteMind AI
  version: 1.0.0

# All paths are relative to the project root (or to $ROUTEMIND_HOME if set)
paths:
  raw_data: data/raw/deliveries.csv
  new_data: data/external/new_deliveries.csv
  processed_dir: data/processed
  models_dir: artifacts/models
  metrics_dir: artifacts/metrics
  reference_dir: artifacts/reference
  logs_dir: logs

data:
  auto_generate: true        # create a synthetic dataset if raw_data does not exist
  n_samples: 20000
  random_state: 42
  test_size: 0.2
  missing_rate: 0.01         # share of values blanked in optional columns (tests the imputers)
  reference_sample_size: 2000

target:
  delay_column: delay_minutes
  on_time_max_minutes: 5        # <= 5 min late  -> ON_TIME
  slight_delay_max_minutes: 20  # <= 20 min late -> SLIGHT_DELAY, above -> HIGH_DELAY

validation:
  min_rows: 200
  max_missing_ratio: 0.30
  max_delay_minutes: 600
  ranges:
    distance_km: [0.1, 200]
    traffic_level: [0, 10]
    temperature: [-10, 55]
    rain: [0, 1]
    hour: [0, 23]
    driver_experience: [0, 45]
    current_speed: [0, 120]
    route_congestion: [0, 10]

model:
  classifier:
    max_iter: 250
    learning_rate: 0.08
    max_depth: 8
    random_state: 42
  regressor:
    max_iter: 250
    learning_rate: 0.08
    max_depth: 8
    random_state: 42

# A candidate model replaces the production model only if it is not worse
promotion:
  min_f1_improvement: 0.0     # candidate macro-F1 must be >= production + this value
  max_mae_increase: 0.05      # candidate MAE may be at most 5% worse than production

# Risk levels: P(delay) gates whether a delay is likely at all, then the
# expected delay (minutes) decides how severe it is.
risk:
  low_delay_minutes: 5          # expected delay below this -> LOW
  medium_probability: 0.35      # P(delay) below this -> LOW
  high_delay_minutes: 20        # expected delay >= 20 min -> HIGH
  critical_delay_minutes: 40    # expected delay >= 40 min -> CRITICAL

monitoring:
  window_size: 1000            # most recent predictions used for drift checks
  min_samples: 200             # do not judge drift on fewer predictions
  psi_threshold: 0.2           # PSI > 0.2 => feature drifted
  min_drifted_features: 2      # drifted features needed to flag the model
  feedback_min_samples: 30     # ground-truth rows needed to judge live accuracy
  mae_degradation_ratio: 1.5   # live MAE > 1.5x training MAE => performance drop
