name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit + API tests
        run: pytest

  docker:
    name: Build, scan and smoke-test the API image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          load: true
          tags: routemind-api:ci

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: routemind-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 routemind-api:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"distance_km":18.4,"traffic_level":8,"rain":true,"vehicle_type":"bike","delivery_zone":"urban","hour":18,"driver_experience":2.4,"current_speed":18}'
          docker logs api
