services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: routemind-api:local
    ports:
      - "8000:8000"
    volumes:
      # named volumes keep prediction logs and model versions across restarts
      - routemind_artifacts:/app/artifacts
      - routemind_logs:/app/logs
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    image: routemind-dashboard:local
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  routemind_artifacts:
  routemind_logs:
